<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jai Balayya</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Inter, system-ui, sans-serif;
    background: #ffffff;
    color: #1c1917;
    overflow: hidden;
    user-select: none;
    cursor: crosshair;
  }
  .counter {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    font-size: 15px; font-weight: 500; color: #78716c;
    font-variant-numeric: tabular-nums; z-index: 10;
  }
  .counter b { color: #1c1917; }
  #stage { position: fixed; inset: 0; pointer-events: none; z-index: 20; }

  .overlay {
    position: fixed; inset: 0; z-index: 30;
    display: grid; place-items: center;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .overlay.show { opacity: 1; }
  .overlay.final { pointer-events: auto; cursor: pointer; }
  .overlay h1 {
    font-size: clamp(48px, 11vw, 120px); font-weight: 800; letter-spacing: -.02em;
    transform: scale(.85); transition: transform .4s cubic-bezier(.2, 1.4, .4, 1);
  }
  .overlay.show h1 { transform: scale(1); }
</style>
</head>
<body>

<div class="counter"><b id="count">0</b> / 500</div>
<canvas id="stage"></canvas>
<div class="overlay" id="overlay"><h1>JAI BALAYYA</h1></div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const countEl = document.getElementById('count');
const overlay = document.getElementById('overlay');
const LIMIT = 500;  // max stick men
const EVERY = 20;   // pop the name every 20 landings
const SIZE = 34; // stick man height in px
let men = [], spawned = 0, fallen = 0, hideTimer;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

function spawn(x, y) {
  men.push({
    x, y,
    vx: (Math.random() - .5) * 2,
    vy: -2 - Math.random() * 2,
    rot: 0,
    vr: (Math.random() - .5) * .25,
    t: Math.random() * 10,
    landed: false,
  });
}

// ground height under x, so landed men pile up
function groundAt(x) {
  let g = innerHeight - 4;
  for (const m of men) {
    if (m.landed && Math.abs(m.x - x) < SIZE * .8) g = Math.min(g, m.restY - 9);
  }
  return g;
}

function drawMan(m) {
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.rot);
  ctx.strokeStyle = '#1c1917';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  const flail = m.landed ? 0 : Math.sin(m.t) * .9;
  const h = SIZE / 2;
  ctx.beginPath(); ctx.arc(0, -h + 5, 5, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -h + 10); ctx.lineTo(0, 4); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -h + 14); ctx.lineTo(-9, -h + 14 - 7 * Math.cos(flail) - 4);
  ctx.moveTo(0, -h + 14); ctx.lineTo(9, -h + 14 - 7 * Math.cos(-flail) - 4);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, 4); ctx.lineTo(-6 + flail * 3, h);
  ctx.moveTo(0, 4); ctx.lineTo(6 - flail * 3, h);
  ctx.stroke();
  ctx.restore();
}

function step() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const m of men) {
    if (!m.landed) {
      m.vy += .35;
      m.x += m.vx;
      m.y += m.vy;
      m.rot += m.vr;
      m.t += .35;
      const g = groundAt(m.x);
      if (m.y + 6 >= g) {
        m.landed = true;
        m.y = m.restY = g - 6;
        m.rot = Math.random() > .5 ? Math.PI / 2 : -Math.PI / 2;
        onFallen();
      }
    }
    drawMan(m);
  }
  requestAnimationFrame(step);
}
requestAnimationFrame(step);

function onFallen() {
  fallen++;
  countEl.textContent = fallen;
  if (fallen % EVERY === 0) {
    clearTimeout(hideTimer);
    overlay.classList.add('show');
    if (fallen >= LIMIT) {
      overlay.classList.add('final'); // stays up; click to start over
    } else {
      hideTimer = setTimeout(() => overlay.classList.remove('show'), 1500);
    }
  }
}

document.addEventListener('pointerdown', e => {
  if (spawned >= LIMIT) return;
  spawned++;
  spawn(e.clientX, e.clientY);
});

// after 500, click the popup to start over
overlay.addEventListener('click', () => {
  if (!overlay.classList.contains('final')) return;
  men = []; spawned = 0; fallen = 0;
  countEl.textContent = 0;
  overlay.classList.remove('show', 'final');
});
</script>
</body>
</html>
